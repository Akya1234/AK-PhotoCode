name: Build AK PhotoCode Android App

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool libltdl-dev \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev automake
          pip install --upgrade pip
          pip install buildozer

      - name: Build Android App Bundle
        id: android_build_diagnostics
        continue-on-error: true
        env:
          BUILDOZER_ALLOW_ORG_TEST_DOMAIN: "1"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          set -o pipefail
          buildozer android release 2>&1 | tee build.log

      - name: Capture generated Android resources
        if: always()
        run: |
          {
            echo "========== GENERATED STRINGS.XML =========="
            find .buildozer -type f -path "*/res/values/strings.xml" -print | while IFS= read -r f; do echo "FILE: $f"; nl -ba "$f"; done
            echo "========== ANDROID MANIFESTS =========="
            find .buildozer -type f -name AndroidManifest.xml -print | while IFS= read -r f; do echo "FILE: $f"; sed -n "1,120p" "$f"; done
            echo "========== RESOURCE ERROR REFERENCES =========="
            grep -RniE 'Invalid unicode escape|Failed to flatten XML|app_name|AAPT:' .buildozer 2>/dev/null | tail -100 || true
          } > android-resource-diagnostics.txt 2>&1
      - name: Upload Android resource diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AK-PhotoCode-Resource-Diagnostics
          if-no-files-found: warn
          path: |
            android-resource-diagnostics.txt
            .buildozer/**/res/values/strings.xml
            .buildozer/**/AndroidManifest.xml
      - name: Upload complete build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AK-PhotoCode-Build-Log
          path: build.log
          if-no-files-found: warn

      - name: Upload Android package
        if: steps.android_build_diagnostics.outcome == \'success\'
        uses: actions/upload-artifact@v4
        with:
          name: AK-PhotoCode-Android
          path: bin/*.aab
          if-no-files-found: error

      - name: Build universal test APK
        if: steps.android_build_diagnostics.outcome == \'success\'
        env:
          KEYSTORE_PASSWORD: AKPhotoCodeTemp2026
        run: |
          set -euo pipefail
          AAB="$(find bin -maxdepth 1 -name '*.aab' -print -quit)"
          test -n "$AAB"
          curl -fsSL https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/photocode-test.jks" -alias photocode-test -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=AK PhotoCode, O=AK-YASIR, C=IN"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle="$AAB" --output="$RUNNER_TEMP/AK-PhotoCode-Test.apks" --mode=universal --ks="$RUNNER_TEMP/photocode-test.jks" --ks-key-alias=photocode-test --ks-pass="pass:$KEYSTORE_PASSWORD" --key-pass="pass:$KEYSTORE_PASSWORD"
          unzip -p "$RUNNER_TEMP/AK-PhotoCode-Test.apks" universal.apk > bin/AK-PhotoCode-universal.apk
          test -s bin/AK-PhotoCode-universal.apk

      - name: Upload universal APK
        if: steps.android_build_diagnostics.outcome == \'success\'
        uses: actions/upload-artifact@v4
        with:
          name: AK-PhotoCode-Universal-APK
          path: bin/AK-PhotoCode-universal.apk
          if-no-files-found: error
      - name: Report Android build failure
        if: steps.android_build_diagnostics.outcome == 'failure'
        run: exit 1
