name: Build AK PhotoCode Android App

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev automake
          pip install --upgrade pip
          pip install buildozer

      - name: Build Android App Bundle
        env:
          BUILDOZER_ALLOW_ORG_TEST_DOMAIN: "1"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          set -o pipefail
          buildozer android release 2>&1 | tee build.log

      - name: Upload complete build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AK-PhotoCode-Build-Log
          path: build.log
          if-no-files-found: warn

      - name: Upload Android package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AK-PhotoCode-Android
          path: bin/*.aab
          if-no-files-found: error
